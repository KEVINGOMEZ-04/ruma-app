name: Build Android APK & AAB (Capacitor 8 / API 36)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de compilación (debug APK para pruebas o release AAB para Google Play)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
  push:
    tags:
      - 'v*'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Lint & Unit Tests
        run: npm run lint && npm test

      - name: Build web assets
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_BACKEND_API_URL: ${{ secrets.VITE_BACKEND_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.VITE_GOOGLE_ANDROID_CLIENT_ID }}
          VITE_REVENUECAT_ANDROID_KEY: ${{ secrets.VITE_REVENUECAT_ANDROID_KEY }}

      - name: Decode google-services.json (if configured)
        env:
          B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$B64" ]; then
            printf '%s' "$B64" | tr -d '\r\n ' | base64 --decode > android/app/google-services.json
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Decode release keystore (if configured)
        env:
          B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$B64" ]; then
            printf '%s' "$B64" | tr -d '\r\n ' | base64 --decode > android/ruma-release.keystore
          fi

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type != 'release' && !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: android
        env:
          RUMA_KEYSTORE_PATH: ${{ github.workspace }}/android/ruma-release.keystore
          RUMA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RUMA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RUMA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleDebug

      - name: Build Release AAB & APK (Google Play)
        if: ${{ github.event.inputs.build_type == 'release' || startsWith(github.ref, 'refs/tags/v') }}
        working-directory: android
        env:
          RUMA_KEYSTORE_PATH: ${{ github.workspace }}/android/ruma-release.keystore
          RUMA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RUMA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RUMA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease

      - name: Upload Debug APK
        if: ${{ github.event.inputs.build_type != 'release' && !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: ruma-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload Release AAB & APK
        if: ${{ github.event.inputs.build_type == 'release' || startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: ruma-android-release
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
